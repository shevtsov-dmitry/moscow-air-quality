version: '3.9'

services:
  db:
    image: postgres:16
    profiles:
      - standalone-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/database:/docker-entrypoint-initdb.d
    ports:
      - '0:5432'

  server:
    build: ./server
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      APP_PORT: 8080
    ports:
      - '0:8080'
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - '0:80'
    restart: unless-stopped

volumes:
  postgres_data:

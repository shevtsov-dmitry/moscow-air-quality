<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../static/tab_icon.png" />
  <link rel="stylesheet" href="../css/admin_page/authorization.css">
  <title>Авторизация</title>
</head>

<body>
  <div class="login-form">
    <h2 class="login-header">Вход</h2>
    <form id="form-with-data">
      <label for="username">Имя пользователя</label>
      <input type="text" id="username" name="username" placeholder="Введите ваше имя пользователя">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" placeholder="Введите ваш пароль">
      <div class="attempts-block">
        <p class="attempts-counter">попыток: </p>
      </div>
      <div class="button-class-aligner"><button type="submit">Войти</button></div>
    </form>
  </div>
</body>
<script src="../script/admin_page/authorization_script.js"></script>

</html>
